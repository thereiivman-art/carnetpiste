<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Horaires habituels d'un circuit (admin) — Carnet de Piste</title>
<style>
  body { font: 15px -apple-system, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #16212c; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input, textarea { font-size: 1rem; padding: 0.5rem; width: 100%; box-sizing: border-box; margin-top: 0.3rem; font-family: inherit; }
  textarea { font-family: monospace; font-size: 0.85rem; }
  button { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; margin-top: 1.2rem; }
  button.danger { background: #a33; color: #fff; border: none; border-radius: 6px; }
  .help { font-size: 0.82rem; color: #666; font-weight: 400; margin-top: 0.2rem; }
  .event-pick { display: block; border: 1px solid #ccc; border-radius: 8px; padding: 0.6rem 0.8rem; margin-top: 0.5rem; cursor: pointer; }
  .event-pick:hover { background: #f5f5f5; }
  .event-pick input { width: auto; display: inline; margin: 0 0.5rem 0 0; }
  #log { white-space: pre-wrap; background: #f2f2f2; padding: 1rem; margin-top: 1.2rem; font-family: monospace; font-size: 0.85rem; max-height: 420px; overflow: auto; }
  #step2, #step3 { display: none; }
</style>
</head>
<body>
<h1>Horaires habituels d'un circuit</h1>
<p>Écrit les horaires habituels d'un circuit (fiche circuit, champ horaires). Pré-rempli avec Misano (EYBIS, 4 groupes A-D, 20 min, pause 13h-14h, nouveaux groupes l'après-midi). Réservé à l'admin.</p>

<div id="step1">
  <label for="login-email">Email (compte admin)</label>
  <input type="email" id="login-email" autocomplete="username">
  <label for="login-password">Mot de passe</label>
  <input type="password" id="login-password" autocomplete="current-password">
  <button id="login-btn">Se connecter</button>
</div>

<div id="step2">
  <label for="circuit-name">Circuit (nom exact tel qu'affiché dans l'appli)</label>
  <input type="text" id="circuit-name" value="Misano">
  <label for="h-groupA">Groupe A</label>
  <textarea id="h-groupA" rows="2">9h00-9h20, 10h20-10h40, 11h40-12h00, 14h00-14h20, 15h20-15h40, 16h40-17h00</textarea>
  <label for="h-groupB">Groupe B</label>
  <textarea id="h-groupB" rows="2">9h20-9h40, 10h40-11h00, 12h00-12h20, 14h20-14h40, 15h40-16h00, 17h00-17h20</textarea>
  <label for="h-groupC">Groupe C</label>
  <textarea id="h-groupC" rows="2">9h40-10h00, 11h00-11h20, 12h20-12h40, 14h40-15h00, 16h00-16h20, 17h20-17h40</textarea>
  <label for="h-groupD">Groupe D</label>
  <textarea id="h-groupD" rows="2">10h00-10h20, 11h20-11h40, 12h40-13h00, 15h00-15h20, 16h20-16h40, 17h40-18h00</textarea>
  <button type="button" class="danger" id="save-btn">Enregistrer les horaires habituels</button>
</div>

<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  var logEl = document.getElementById('log');
  function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }
  function safeDocId(name) { return encodeURIComponent(name).slice(0, 300) || '_'; }
  var db, auth;
  function onLoggedIn(label) {
    log('Connecté' + (label ? ' (' + label + ')' : '') + '.');
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  }
  if (typeof firebase === 'undefined' || !firebase.auth) {
    log('ERREUR : le moteur Firebase ne s\'est pas chargé. Recharge la page.');
  } else {
    db = firebase.firestore();
    auth = firebase.auth();
    auth.onAuthStateChanged(function (user) {
      if (user && document.getElementById('step1').style.display !== 'none') onLoggedIn(user.email + ', session de l\'app');
    });
  }
  document.getElementById('login-btn').addEventListener('click', function () {
    if (!auth) { log('Firebase indisponible -- recharge la page.'); return; }
    log('Connexion...');
    auth.signInWithEmailAndPassword(document.getElementById('login-email').value.trim(), document.getElementById('login-password').value)
      .then(function () { onLoggedIn(document.getElementById('login-email').value.trim()); })
      .catch(function (err) { log('ERREUR : ' + (err && err.message ? err.message : err)); });
  });
  document.getElementById('save-btn').addEventListener('click', function () {
    var name = document.getElementById('circuit-name').value.trim();
    if (!name) { log('Indique un nom de circuit.'); return; }
    var horaires = {};
    ['A', 'B', 'C', 'D'].forEach(function (l) {
      var v = document.getElementById('h-group' + l).value.trim();
      if (v) horaires['group' + l] = v;
    });
    log('--- Enregistrement des horaires de "' + name + '" ---');
    db.collection('circuits').doc(safeDocId(name)).set({ name: name, horaires: horaires }, { merge: true }).then(function () {
      log('OK -- horaires habituels de ' + name + ' enregistrés (plan, notes et autres champs conservés).');
    }).catch(function (err) {
      log('ERREUR : ' + (err && err.code === 'permission-denied' ? 'refusé -- réservé à l\'admin.' : (err && err.message ? err.message : err)));
    });
  });
</script>
</body>
</html>
