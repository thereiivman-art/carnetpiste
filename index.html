<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages has no way to configure real Cache-Control headers, and
     this HTML document itself (unlike app.js/style.css below) can't be
     query-string versioned since it's the page's own URL -- these are a
     best-effort ask for a mobile browser to actually revalidate it
     instead of serving a stale copy from a previous deploy indefinitely. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Carnet de Piste</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16212c">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet de Piste">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026090715">
<script>
// Applied before the stylesheet paints, so a saved Light/Dark choice never
// flashes the system theme first. "system" (no saved choice) leaves the
// attribute unset, letting the CSS media query decide as before.
(function () {
  try {
    var t = localStorage.getItem('carnet-de-piste-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="wrap"><div id="root"></div></div>
<div class="toast-stack" id="toast-stack"></div>
<div class="annot-overlay" id="annot-overlay"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- ?v= is bumped by hand on every deploy that touches app.js/style.css --
     GitHub Pages serves these with long-lived caching, and a plain
     <script src="app.js"> with no cache-busting meant a returning
     browser could keep running yesterday's code after a normal reload,
     only picking up a fix on a hard refresh. Bump this same version on
     both tags together whenever either file changes. -->
<script src="app.js?v=2026090715"></script>
<script>
// Registers the offline app-shell worker (see sw.js) so the app installs
// on the home screen and still opens (cached UI + last-seen data via
// Firestore's own offline persistence) with no signal at the track.
// Deliberately no custom "new version available" prompt: the worker
// updates itself in the background and the new shell simply takes over
// on the next full reload, same as any other static-site deploy.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
