<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Sécurité : seuls ces domaines peuvent fournir du code, et aucun script en ligne (ni onclick="…") ne s'exécute : un texte piégé glissé dans la page reste inerte. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net blob:; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https: wss: data: blob:; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' https: blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://*.firebaseapp.com">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- GitHub Pages has no way to configure real Cache-Control headers, and
     this HTML document itself (unlike app.js/style.css below) can't be
     query-string versioned since it's the page's own URL -- these are a
     best-effort ask for a mobile browser to actually revalidate it
     instead of serving a stale copy from a previous deploy indefinitely. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Carnet Piste</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f3ef">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Piste">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2026110110">
<script src="theme-boot.js?v=2026110110"></script>
</head>
<body>
<div class="wrap"><div id="root"></div></div>
<div class="toast-stack" id="toast-stack"></div>
<div class="annot-overlay" id="annot-overlay"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- ?v= is bumped by hand on every deploy that touches app.js/style.css --
     GitHub Pages serves these with long-lived caching, and a plain
     <script src="app.js"> with no cache-busting meant a returning
     browser could keep running yesterday's code after a normal reload,
     only picking up a fix on a hard refresh. Bump this same version on
     both tags together whenever either file changes. -->
<script src="chrono-import.js?v=2026110110"></script>
<script src="app.js?v=2026110110"></script>
<script src="sw-register.js?v=2026110110"></script>
</body>
</html>
