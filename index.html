<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Piste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
// Applied before the stylesheet paints, so a saved Light/Dark choice never
// flashes the system theme first. "system" (no saved choice) leaves the
// attribute unset, letting the CSS media query decide as before.
(function () {
  try {
    var t = localStorage.getItem('carnet-de-piste-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>
<!-- A regular (non-PWA) tab can't reliably force portrait via the Screen
     Orientation API -- most browsers only grant lock() in fullscreen/
     installed-app mode. This overlay is the actual, always-working fix:
     covers the screen and blocks interaction whenever a narrow (mobile)
     viewport is held in landscape, see .landscape-lock-overlay in
     style.css. init() in app.js also makes a best-effort lock() attempt
     for whoever does have the app installed to their home screen. -->
<div class="landscape-lock-overlay">🔄 Tourne ton téléphone en mode portrait pour utiliser Carnet de Piste.</div>
<div class="wrap"><div id="root"></div></div>
<div class="toast-stack" id="toast-stack"></div>
<div class="annot-overlay" id="annot-overlay"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
